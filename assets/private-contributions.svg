<svg xmlns="http://www.w3.org/2000/svg" width="820" height="388" viewBox="0 0 820 388" role="img" aria-labelledby="title desc">
  <title id="title">Self-view contribution stats for mashfromband</title>
  <desc id="desc">Aggregate contribution totals mirroring the signed-in owner view, including private contributions. Repository names and URLs are not included.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="52%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="820" height="388" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="818" height="386" rx="23" fill="none" stroke="#334155"/>
  <rect x="28" y="30" width="186" height="8" rx="4" fill="url(#accent)"/>
  <text x="28" y="66" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" font-weight="700">All Activity Signals</text>
  <text x="28" y="314" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">Stack detail: TypeScript x32, JavaScript x22, Python x14, Rust x8</text>
  <text x="28" y="340" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Repo split: 118 private / 9 public / 11 org workspaces. Last 365 days; private included; some org contributions not counted.</text>
  <text x="28" y="362" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">No repository names, URLs, issue titles, or commit messages are published. Latest repo activity: 2026-09-12. Generated: 2026-09-13.</text>
  
  <g>
    <rect x="28" y="86" width="170" height="82" rx="16" fill="#111827" stroke="#334155"/>
    <text x="46" y="120" fill="#94a3b8" font-size="13">Total contributions</text>
    <text x="46" y="148" fill="#f8fafc" font-size="28" font-weight="700">38784</text>
  </g>
  <g>
    <rect x="219" y="86" width="170" height="82" rx="16" fill="#111827" stroke="#334155"/>
    <text x="237" y="120" fill="#94a3b8" font-size="13">Commits</text>
    <text x="237" y="148" fill="#f8fafc" font-size="28" font-weight="700">16084</text>
  </g>
  <g>
    <rect x="410" y="86" width="170" height="82" rx="16" fill="#111827" stroke="#334155"/>
    <text x="428" y="120" fill="#94a3b8" font-size="13">Pull requests</text>
    <text x="428" y="148" fill="#f8fafc" font-size="28" font-weight="700">9688</text>
  </g>
  <g>
    <rect x="601" y="86" width="170" height="82" rx="16" fill="#111827" stroke="#334155"/>
    <text x="619" y="120" fill="#94a3b8" font-size="13">Issues</text>
    <text x="619" y="148" fill="#f8fafc" font-size="28" font-weight="700">9006</text>
  </g>
  <g>
    <rect x="28" y="178" width="170" height="82" rx="16" fill="#111827" stroke="#334155"/>
    <text x="46" y="212" fill="#94a3b8" font-size="13">Code reviews</text>
    <text x="46" y="240" fill="#f8fafc" font-size="28" font-weight="700">3992</text>
  </g>
  <g>
    <rect x="219" y="178" width="170" height="82" rx="16" fill="#111827" stroke="#334155"/>
    <text x="237" y="212" fill="#94a3b8" font-size="13">Accessible repos</text>
    <text x="237" y="240" fill="#f8fafc" font-size="28" font-weight="700">127</text>
  </g>
  <g>
