name: Profile README Quality

on:
  pull_request:
    paths:
      - "README.md"
      - "assets/private-contributions.svg"
      - ".github/workflows/profile-readme.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "assets/private-contributions.svg"
      - ".github/workflows/profile-readme.yml"

permissions:
  contents: read

jobs:
  markdown-link-check:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check README links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude capsule-render.vercel.app
            --exclude readme-typing-svg.demolab.com
            --exclude img.shields.io
            --exclude github-readme-stats.vercel.app
            --exclude github-profile-summary-cards.vercel.app
            --exclude streak-stats.demolab.com
            --exclude github-readme-activity-graph.vercel.app
            --exclude komarev.com
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
