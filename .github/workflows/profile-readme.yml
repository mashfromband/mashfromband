name: Profile README Quality

on:
  # Run on every pull request and push to main (no path filter) so the
  # "Markdown links" check always reports a status and can serve as a required
  # status check without deadlocking PRs that do not touch README.md.
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  markdown-link-check:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check README links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude capsule-render.vercel.app
            --exclude readme-typing-svg.demolab.com
            --exclude img.shields.io
            --exclude github-readme-stats.vercel.app
            --exclude github-profile-summary-cards.vercel.app
            --exclude streak-stats.demolab.com
            --exclude github-readme-activity-graph.vercel.app
            --exclude komarev.com
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
