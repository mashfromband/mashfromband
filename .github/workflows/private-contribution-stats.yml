name: All Activity Signals

on:
  workflow_dispatch:
  schedule:
    # Daily keeps the profile current while staying lightweight for a public profile repository.
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

env:
  PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}

jobs:
  generate:
    name: Generate aggregate activity stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check token configuration
        if: ${{ env.PROFILE_STATS_TOKEN == '' }}
        run: |
          echo "::warning title=PROFILE_STATS_TOKEN is not configured::Skipping aggregate activity refresh because private repository aggregates require a fine-grained token."
          echo "Create a fine-grained token with read-only metadata and contents access for the repositories you want counted."

      - name: Set up Python
        if: ${{ env.PROFILE_STATS_TOKEN != '' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate activity signals SVG
        if: ${{ env.PROFILE_STATS_TOKEN != '' }}
        run: python scripts/generate_private_contribution_stats.py --output assets/private-contributions.svg --username mashfromband

      - name: Create update pull request
        if: ${{ env.PROFILE_STATS_TOKEN != '' }}
        uses: peter-evans/create-pull-request@v8
        with:
          # Use a PAT (not GITHUB_TOKEN) so the automation PR triggers the
          # required status checks; PRs opened by GITHUB_TOKEN do not.
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          branch: automation/all-activity-signals
          title: "chore: update all activity signals"
          commit-message: "chore: update all activity signals"
          body: |
            ## Summary

            - Regenerate aggregate-only activity signals for the profile README.
            - Runs daily to keep the profile current without publishing private repository details.

            ## Privacy

            - Private repository names, URLs, issue titles, and commit messages are not written to the SVG.
          labels: documentation
          assignees: mashfromband
          add-paths: |
            assets/private-contributions.svg
