name: All Activity Signals

on:
  workflow_dispatch:
    inputs:
      review_hours:
        description: "Public activity grace period: 168 normally; 0 for explicit acceptance"
        type: choice
        options: ["168", "0"]
        default: "168"
      public_only:
        description: "Only refresh public development activity"
        type: boolean
        default: false
  schedule:
    # Daily keeps the profile current while staying lightweight for a public profile repository.
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: profile-daily-refresh
  cancel-in-progress: false

jobs:
  generate:
    name: Generate aggregate activity stats
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.public_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check token configuration
        if: ${{ env.PROFILE_STATS_TOKEN == '' }}
        run: |
          echo "::warning title=PROFILE_STATS_TOKEN is not configured::Skipping aggregate activity refresh because private repository aggregates require a fine-grained token."
          echo "Create a fine-grained token with read-only metadata and contents access for the repositories you want counted."

      - name: Set up Python
        if: ${{ env.PROFILE_STATS_TOKEN != '' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate activity signals SVG
        if: ${{ env.PROFILE_STATS_TOKEN != '' }}
        run: python scripts/generate_private_contribution_stats.py --output assets/private-contributions.svg --username mashfromband

      - name: Create update pull request
        if: ${{ env.PROFILE_STATS_TOKEN != '' }}
        uses: peter-evans/create-pull-request@v8
        with:
          # Use a PAT (not GITHUB_TOKEN) so the automation PR triggers the
          # required status checks; PRs opened by GITHUB_TOKEN do not.
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          branch: automation/all-activity-signals
          title: "chore: update all activity signals"
          commit-message: "chore: update all activity signals"
          body: |
            ## Summary

            - Regenerate aggregate-only activity signals for the profile README.
            - Runs daily to keep the profile current without publishing private repository details.

            ## Privacy

            - Private repository names, URLs, issue titles, and commit messages are not written to the SVG.
          labels: documentation
          assignees: mashfromband
          add-paths: |
            assets/private-contributions.svg

  public-activity:
    name: Refresh public development activity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      REVIEW_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.review_hours || '168' }}
    steps:
      - name: Checkout trusted default-branch collector
        id: collector
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Collect, preserve edits, check and publish when due
        env:
          TRUSTED_COLLECTOR_SHA: ${{ steps.collector.outputs.commit }}
        run: go run ./cmd/profile-activity -mode sync -review-hours "$REVIEW_HOURS"
